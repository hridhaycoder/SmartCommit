[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-smart-commit-hridhay"
version = "0.1.0"
description = "AI-powered Git Conventional Automatic Commiter  using local Ollama models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
git-smart-commit = "cli:main"

[tool.setuptools]
py-modules = ["cli"]